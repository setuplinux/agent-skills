# Lab example. Review namespace ownership, image policy and admission rules first.
# This creates no NodePort/LoadBalancer and publishes no internet-facing listener.
apiVersion: v1
kind: Namespace
metadata:
  name: hks-demo
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-hello-page
  namespace: hks-demo
data:
  index.html: |
    <!doctype html>
    <html lang="en">
      <head><meta charset="utf-8"><title>Hello from HKS</title></head>
      <body><h1>Hello from HKS!</h1><p>Served by nginx in Kubernetes.</p></body>
    </html>
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-hello
  namespace: hks-demo
  labels:
    app: nginx-hello
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx-hello
  template:
    metadata:
      labels:
        app: nginx-hello
    spec:
      automountServiceAccountToken: false
      containers:
        - name: nginx
          image: nginx:1.28-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          volumeMounts:
            - name: page
              mountPath: /usr/share/nginx/html
              readOnly: true
      volumes:
        - name: page
          configMap:
            name: nginx-hello-page
---
apiVersion: v1
kind: Service
metadata:
  name: nginx-hello
  namespace: hks-demo
  labels:
    app: nginx-hello
spec:
  type: ClusterIP
  selector:
    app: nginx-hello
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
